name: Digest Portofolio Mingguan

on:
  schedule:
    # 07:00 WIB = 00:00 UTC, tiap Senin. CATATAN: schedule GitHub Actions
    # HANYA berjalan dari branch default (main). Di uat, tes pakai push/manual.
    - cron: "0 0 * * 1"
  workflow_dispatch: {}   # tombol "Run workflow" manual untuk tes (branch mana pun)
  push:
    branches: [uat]       # setiap push ke uat -> jalankan sebagai smoke-test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kirim digest
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py
